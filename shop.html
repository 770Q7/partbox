<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Shop</title>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
</head>
<body>

    <h1>Avatar Shop</h1>
    <p>Buy items and they’ll be added to your inventory!</p>

    <div id="shop">
        <button onclick="buyItem('Hat')">Buy Hat</button>
        <button onclick="buyItem('Glasses')">Buy Glasses</button>
        <button onclick="buyItem('Jacket')">Buy Jacket</button>
    </div>

    <h2>Your Inventory</h2>
    <ul id="inventoryList"></ul>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
    apiKey: "AIzaSyCiU2CqXcpWa7gLeJz0_-5dqzmgCig3Be8",
    authDomain: "accounts-e6751.firebaseapp.com",
    projectId: "accounts-e6751",
    storageBucket: "accounts-e6751.firebasestorage.app",
    messagingSenderId: "813001288493",
    appId: "1:813001288493:web:6a296b6f1b2ca35f1b41a4"
        };
        firebase.initializeApp(firebaseConfig);

        // Function to Buy Items
        function buyItem(itemId) {
            let user = firebase.auth().currentUser;
            if (!user) {
                alert("You need to be logged in to buy items!");
                return;
            }

            firebase.firestore().collection("users").doc(user.uid).update({
                inventory: firebase.firestore.FieldValue.arrayUnion(itemId)
            }).then(() => {
                alert(`You bought a ${itemId}!`);
                loadInventory(); // Refresh inventory after purchase
            }).catch(error => {
                console.error("Error adding item:", error);
            });
        }

        // Function to Load User Inventory
        function loadInventory() {
            let user = firebase.auth().currentUser;
            if (!user) return;

            firebase.firestore().collection("users").doc(user.uid).get()
                .then(doc => {
                    let items = doc.data().inventory || [];
                    let list = document.getElementById("inventoryList");
                    list.innerHTML = "";
                    items.forEach(item => {
                        let li = document.createElement("li");
                        li.innerText = item;
                        list.appendChild(li);
                    });
                })
                .catch(error => console.error("Error fetching inventory:", error));
        }

        // Load Inventory When Logged In
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                loadInventory();
            } else {
                document.getElementById("inventoryList").innerHTML = "<p>Please log in to view your inventory.</p>";
            }
        });
    </script>

</body>
</html>
