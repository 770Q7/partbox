<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.1"></script>
</head>
<body style="margin: 0;">
    <style>
        #joystickContainer {
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 150px;
            height: 150px;
            display: none;
        }

        #healthContainer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 200px;
            height: 20px;
            border: 2px solid black;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background: rgb(61, 153, 58); /* Start at full health (green) */
            transition: background 0.5s ease-in-out; /* Smooth transition */
        }

        #damageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.25s ease-out;
            pointer-events: none;
        }
    </style>

    <div id="joystickContainer"></div>
    <div id="healthContainer">
        <div id="healthBar"></div>
    </div>
    <div id="damageOverlay"></div>

    <script>
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        renderer.domElement.addEventListener("contextmenu", (event) => event.preventDefault());

        const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load("sky3.png"),
            side: THREE.BackSide
        });
        scene.add(new THREE.Mesh(skyGeometry, skyMaterial));

        const groundTexture = new THREE.TextureLoader().load("grass.png");
        groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(10, 10);
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.MeshPhongMaterial({ map: groundTexture, color: 0x5B7B26 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        scene.add(new THREE.AmbientLight(0xfc966a, 1));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(0, 50, -30);
        scene.add(directionalLight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        scene.add(camera);

        let character;
        new THREE.GLTFLoader().load("player.glb", (gltf) => {
            character = gltf.scene;
            character.position.set(0, 0.9, 0);
            scene.add(character);
        });

        const keys = {}, movementSpeed = 0.1;
        let cameraAngleY = 0, cameraAngleX = 0, cameraDistance = 5;
        let isRightClickHeld = false;

        window.addEventListener("mousedown", (event) => {
            if (event.button === 2) {
                isRightClickHeld = true;
                event.preventDefault();
            }
        });
        window.addEventListener("mouseup", (event) => {
            if (event.button === 2) isRightClickHeld = false;
        });

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        window.addEventListener("mousemove", (event) => {
            if (isRightClickHeld) {
                cameraAngleY -= event.movementX * 0.005;
                cameraAngleX = Math.min(Math.PI / 3, Math.max(-Math.PI / 3, cameraAngleX + event.movementY * 0.005));
            }
        });

        window.addEventListener("wheel", (event) => {
            cameraDistance = Math.max(2, Math.min(10, cameraDistance + event.deltaY * 0.01));
        });

        let characterHealth = 100; // Initialize health

        function takeDamage(amount) {
            characterHealth = Math.max(0, characterHealth - amount);
            updateHealthDisplay();

            // Flash red overlay when damaged
            const overlay = document.getElementById("damageOverlay");
            overlay.style.opacity = "1";
            setTimeout(() => {
                overlay.style.opacity = "0";
            }, 250);

            if (characterHealth === 0) {
                console.log("Character has died!");
                // Add respawn or game-over logic here
            }
        }

        function heal(amount) {
            characterHealth = Math.min(100, characterHealth + amount);
            updateHealthDisplay();
        }

        function updateHealthDisplay() {
            const healthBar = document.getElementById("healthBar");
            healthBar.style.width = `${characterHealth}%`;

            // Smooth color transition from green (100 health) to gold (50 health) to red (0 health)
            const minColor = [229, 67, 55];  // #E54337 (Red)
            const midColor = [255, 215, 0];  // #FFD700 (Gold Yellow)
            const maxColor = [61, 153, 58];  // #3D993A (Green)

            let ratio, r, g, b;

            if (characterHealth > 50) {
                // Transition from green to gold
                ratio = (characterHealth - 50) / 50;
                r = Math.round(midColor[0] + (maxColor[0] - midColor[0]) * ratio);
                g = Math.round(midColor[1] + (maxColor[1] - midColor[1]) * ratio);
                b = Math.round(midColor[2] + (maxColor[2] - midColor[2]) * ratio);
            } else {
                // Transition from gold to red
                ratio = characterHealth / 50;
                r = Math.round(minColor[0] + (midColor[0] - minColor[0]) * ratio);
                g = Math.round(minColor[1] + (midColor[1] - minColor[1]) * ratio);
                b = Math.round(minColor[2] + (midColor[2] - minColor[2]) * ratio);
            }

            healthBar.style.background = `rgb(${r}, ${g}, ${b})`;
        }

        // Apply damage when pressing "h"
        window.addEventListener("keydown", (e) => {
            if (e.key === "h") takeDamage(10);
        });

        // Health regeneration every second
        setInterval(() => {
            heal(4); // Calls the heal function every second
        }, 1000);

        function animate() {
            requestAnimationFrame(animate);

            if (character) {
                character.rotation.z = Math.PI / 2;

                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), direction);
                const isMoving = keys["w"] || keys["s"] || keys["a"] || keys["d"];

                if (isMoving) {
                    character.rotation.y = Math.atan2(-direction.z, direction.x);
                }

                if (keys["w"]) character.position.addScaledVector(direction, movementSpeed);
                if (keys["s"]) character.position.addScaledVector(direction, -movementSpeed);
                if (keys["a"]) character.position.addScaledVector(right, -movementSpeed);
                if (keys["d"]) character.position.addScaledVector(right, movementSpeed);

                camera.position.set(
                    character.position.x + Math.sin(cameraAngleY) * cameraDistance,
                    character.position.y + 2 + Math.sin(cameraAngleX) * 3,
                    character.position.z + Math.cos(cameraAngleY) * cameraDistance
                );
                camera.lookAt(character.position);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
    <script>// Initialize joystick without removing existing code
const joystick = nipplejs.create({
    zone: document.getElementById("joystickContainer"),
    mode: "dynamic",
    position: { left: "50%", bottom: "10%" },
    color: "black"
});

joystick.on("move", (event, data) => {
    if (character) {
        const angle = data.angle.radian;
        const strength = data.distance / 50; // Scale movement speed

        const moveVector = new THREE.Vector3(
            Math.cos(angle) * strength * movementSpeed,
            0,
            Math.sin(angle) * strength * movementSpeed
        );

        character.position.add(moveVector);
        character.rotation.y = -angle;
    }
});


// Show joystick only on mobile devices
if (/Mobi|Android|iPhone/.test(navigator.userAgent)) {
    document.getElementById("joystickContainer").style.display = "block";
}</script>
<script>
// Load model and set up bounding box
new THREE.GLTFLoader().load("map8.glb", (gltf) => {
    const map = gltf.scene;
    map.position.set(10, 0, 10);
    scene.add(map);

    // Compute bounding box
    map.traverse((child) => {
        if (child.isMesh) {
            child.geometry.computeBoundingBox();
            child.userData.boundingBox = child.geometry.boundingBox.clone();
        }
    });
});

// Function to check collision
function checkCollision(character) {
    const characterBox = new THREE.Box3().setFromObject(character);

    scene.traverse((object) => {
        if (object.userData.boundingBox) {
            const objectBox = object.userData.boundingBox.clone();
            objectBox.applyMatrix4(object.matrixWorld);

            if (characterBox.intersectsBox(objectBox)) {
                console.log("Collision detected!");
                // Implement custom behavior (e.g., stop movement)
            }
        }
    });
}
</script>
<script>
// Load textures
const textureLoader = new THREE.TextureLoader();
const alertTexture = textureLoader.load('alert.png');
const chatboxTexture = textureLoader.load('chatbox.png');

const billboardMaterial = new THREE.MeshBasicMaterial({ map: alertTexture, transparent: true });
const chatboxMaterial = new THREE.MeshBasicMaterial({ map: chatboxTexture, transparent: true });

const billboardGeometry = new THREE.PlaneGeometry(1, 1);
const billboard = new THREE.Mesh(billboardGeometry, billboardMaterial);
billboard.position.set(0, 1.5, 0);
scene.add(billboard);

// Billboard text canvas
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1024;
canvas.height = 512;

const billboardTexture = new THREE.CanvasTexture(canvas);
const billboardTextMaterial = new THREE.MeshBasicMaterial({ map: billboardTexture, transparent: true });

// Dialogue options
const dialogues = [
    "Warning: Something is happening!",
    "Alert! Stay cautious.",
    "Heads up! Danger ahead.",
    "System message: Proceed with care."
];

// Function to update the chatbox with text inside
function updateBillboardText(text) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw chatbox as a background
    ctx.drawImage(chatboxTexture.image, 0, 0, canvas.width, canvas.height);

    // Draw text centered inside chatbox
    ctx.fillStyle = 'white';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const maxWidth = canvas.width - 100;
    const wrappedText = wrapText(ctx, text, maxWidth);

    wrappedText.forEach((line, index) => {
        ctx.fillText(line, canvas.width / 2, canvas.height / 2 + index * 80);
    });

    billboardTexture.needsUpdate = true;
}

// Function to wrap text into multiple lines
function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let currentLine = '';

    words.forEach(word => {
        const testLine = currentLine + (currentLine.length ? ' ' : '') + word;
        if (ctx.measureText(testLine).width > maxWidth) {
            lines.push(currentLine);
            currentLine = word;
        } else {
            currentLine = testLine;
        }
    });

    if (currentLine) {
        lines.push(currentLine);
    }

    return lines;
}

// Click interaction logic
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(billboard);

    if (intersects.length > 0) {
        const randomText = dialogues[Math.floor(Math.random() * dialogues.length)];
        updateBillboardText(randomText);
        billboard.material = billboardTextMaterial;

        setTimeout(() => {
            billboard.material = billboardMaterial; // Reverts to "alert.png" after 6 seconds
        }, 6000);
    }
}

window.addEventListener('click', onClick, false);

</script>

        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);

        padding: 10px;

        display: flex;
    }

        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);

        overflow-y: auto;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;

</style>

</script>
</body>
</html>
