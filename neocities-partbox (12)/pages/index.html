<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>partbox</title>

    <style>
        .square {
            height: 130px;
            width: 343;
            background-color: #0675af;
        }

        .container {
            display: flex;
            justify-content: left;
            align-items: left;
            height: -800vh;
        }

        .avatar {
            background-color: #0675af;
            display: inline-block;
            cursor: pointer;
            color: #ffffff;
            font-family: Arial;
            font-size: 28px;
            font-weight: bold;
            padding: 32px 76px;
            text-decoration: none;
            text-shadow: 0px 1px 0px #92b879;
        }

        .avatar:hover {
            background-color: #0a5a84;
        }

        .avatar:active {
            position: relative;
            top: 1px;
        }

        .groups {
            background-color: #0675af;
            display: inline-block;
            cursor: pointer;
            color: #ffffff;
            font-family: Arial;
            font-size: 28px;
            font-weight: bold;
            padding: 32px 76px;
            text-decoration: none;
            text-shadow: 0px 1px 0px #92b879;
        }

        .groups:hover {
            background-color: #0a5a84;
        }

        .groups:active {
            position: relative;
            top: 1px;
        }

        .myButton {
            background-color: #74ad5a;
            display: inline-block;
            cursor: pointer;
            color: #ffffff;
            font-family: Arial;
            font-size: 28px;
            font-weight: bold;
            padding: 32px 76px;
            text-decoration: none;
            text-shadow: 0px 1px 0px #92b879;
        }

        .myButton:hover {
            background-color: #68a54b;
        }

        .myButton:active {
            position: relative;
            top: 1px;
        }

        .island {
            height: 130px;
            width: 343px;
            background-color: #0675af;
        }

        /* Account Widget */
        #account-widget {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #0675af;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="square">
        <div class="container">
            <img src="partbox2.png" width="348.375" height="91.5">
            <a href="avatar" class="avatar">avatar</a>
            <a href="groups" class="groups">groups</a>
        </div>
    </div>

    <a href="1" class="myButton">play!</a>

    <!-- Account Widget (Shows Username & Bux Balance) -->
    <div id="account-widget">
        <p>Logged in as: <strong id="username-display">Guest</strong></p>
        <p>Bux Balance: <strong id="bux-balance">0</strong></p>
    </div>

    <script>
        function getLoggedInUser() {
            return document.cookie.includes("loggedIn=true") ? localStorage.getItem("loggedInUser") : "Guest";
        }

        function getBuxBalance(username) {
            const userData = JSON.parse(localStorage.getItem("userData")) || {};
            return userData[username]?.balance || 0;
        }

        function giveDailyBux() {
            const username = localStorage.getItem("loggedInUser");
            if (!username) return;

            const today = new Date().toDateString();
            let userData = JSON.parse(localStorage.getItem("userData")) || {};

            if (!userData[username]) {
                userData[username] = { balance: 10, lastClaim: today };
                localStorage.setItem("userData", JSON.stringify(userData));
                return;
            }

            if (userData[username].lastClaim !== today) {
                userData[username].balance += 10;
                userData[username].lastClaim = today;
                localStorage.setItem("userData", JSON.stringify(userData));
            }
        }

        window.onload = function () {
            const username = getLoggedInUser();
            document.getElementById("username-display").innerText = username;

            if (username !== "Guest") {
                document.getElementById("bux-balance").innerText = getBuxBalance(username);
                giveDailyBux(); // Apply daily Bux reward
            }
        };
    </script>

</body>
</html>
